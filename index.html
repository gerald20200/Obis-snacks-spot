<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <style>
      :root {
        --page-bg: #fff8e1;
        --card-bg: #ffffff;
        --card-shadow: rgba(80, 35, 15, 0.12);
        --primary: #e53935;
        --primary-dark: #c62828;
        --accent: #ffc107;
        --text: #1f1f1f;
        --muted: #66615b;
        --border: #eadfc9;
        --input-bg: #fffdf8;
        --link: #c62828;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fff8e1 0%, #fffdf7 48%, #ffedbd 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-page {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .login-card {
        width: min(100%, 460px);
        background: var(--card-bg);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        box-shadow: 0 24px 60px var(--card-shadow);
        padding: 42px 32px 28px;
      }

      .brand {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        margin-bottom: 28px;
        box-shadow: 0 14px 26px rgba(229, 57, 53, 0.22);
        border-bottom: 3px solid var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 2.9rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      .subtitle {
        margin: 12px 0 28px;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.6;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      label {
        font-weight: 700;
        font-size: 0.96rem;
        color: var(--text);
      }

      .forgot-link {
        font-size: 0.85rem;
        color: var(--link);
        text-decoration: none;
        font-weight: 600;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        pointer-events: none;
      }

      .input-wrap input {
        width: 100%;
        height: 56px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        border-radius: 14px;
        padding: 0 52px 0 48px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .input-wrap input::placeholder {
        color: #9aa4b2;
      }

      .input-wrap input:focus {
        border-color: rgba(229, 57, 53, 0.6);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(229, 57, 53, 0.1);
      }

      .toggle-password {
        position: absolute;
        right: 14px;
        border: none;
        background: transparent;
        color: #64748b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        cursor: pointer;
      }

      .toggle-password:hover {
        color: var(--primary);
      }

      .signin-btn {
        margin-top: 8px;
        border: 0;
        border-radius: 14px;
        min-height: 58px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        font-size: 1.04rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        box-shadow: 0 18px 24px rgba(229, 57, 53, 0.2);
      }

      .signin-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 30px rgba(229, 57, 53, 0.24);
      }

      .signin-btn:active {
        transform: translateY(0);
      }

      .signin-btn .arrow {
        display: inline-block;
        margin-left: 10px;
        font-size: 1.4rem;
        line-height: 1;
      }

      .signup-text {
        margin: 26px 0 0;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        text-align: center;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .signup-text a {
        display: inline-block;
        margin-left: 4px;
        padding: 7px 12px;
        border-radius: 8px;
        color: var(--link);
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .signup-text a:hover {
        background: var(--accent);
        color: var(--text);
      }

      @media (max-width: 480px) {
        body {
          padding: 18px;
        }

        .login-card {
          padding: 28px 20px 22px;
          border-radius: 18px;
        }

        .brand {
          width: 48px;
          height: 48px;
          margin-bottom: 22px;
        }

        .subtitle {
          margin-bottom: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand" aria-label="Brand logo">OS</div>

        <h1 id="login-title">Welcome back</h1>
        <p class="subtitle">Enter your credentials to access your dashboard.</p>

        <form class="login-form" action="#" method="post">
          <div class="field">
            <label for="username">Email or Username</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 21C20 17.134 16.418 14 12 14C7.582 14 4 17.134 4 21M12 11C14.7614 11 17 8.76142 17 6C17 3.23858 14.7614 1 12 1C9.23858 1 7 3.23858 7 6C7 8.76142 9.23858 11 12 11Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <input id="username" type="text" placeholder="Email address or username" autocomplete="username" />
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
              <a class="forgot-link" href="#">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 10V8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8V10M6 10H18C19.1046 10 20 10.8954 20 12V19C20 20.1046 19.1046 21 18 21H6C4.89543 21 4 20.1046 4 19V12C4 10.8954 4.89543 10 6 10Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
              <button class="toggle-password" type="button" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12C3.6 7.8 7.2 5 12 5C16.8 5 20.4 7.8 22 12C20.4 16.2 16.8 19 12 19C7.2 19 3.6 16.2 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="signin-btn" type="submit">
            Sign in <span class="arrow" aria-hidden="true">→</span>
          </button>
        </form>

        <p class="signup-text">Don’t have an account? <a href="customer-signup.html">Sign up</a></p>
      </section>
    </main>

    <script>
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.toggle-password');

      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    </script>
  </body>
</html>
