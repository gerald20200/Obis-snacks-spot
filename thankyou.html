<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed | Obi's Snack Spot</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fff8ef 0%, #f7d9a6 100%);
      color: #2a1b12;
      padding: 24px;
    }

    .card {
      width: min(100%, 560px);
      background: white;
      border: 1px solid #f0d8b6;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(163, 64, 0, 0.12);
      padding: 32px 26px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #ffe0b2;
      color: #a04000;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      color: #a04000;
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin: 18px 0 10px;
    }

    p {
      margin: 0 0 12px;
      color: #5f4338;
      line-height: 1.6;
    }

    .summary {
      margin-top: 22px;
      background: #fffaf5;
      border: 1px solid #f0d8b6;
      border-radius: 16px;
      padding: 18px;
      text-align: left;
    }

    .summary strong {
      color: #2a1b12;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background: #d35400;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
      text-align: center;
    }

    .btn.secondary {
      background: #ffffff;
      color: #d35400;
      border: 1px solid #d35400;
    }

    @media (max-width: 540px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 22px 16px;
        border-radius: 18px;
      }

      .summary {
        padding: 14px 12px;
      }

      .summary p {
        font-size: 0.96rem;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Order Confirmed</div>
    <h1>Thank you for your order!</h1>
    <p>Your food request has been received and our team will contact you shortly.</p>

    <div class="summary">
      <p><strong>Name:</strong> <span id="customerName">Guest</span></p>
      <p><strong>Items:</strong> <span id="itemSummary">-</span></p>
      <p><strong>Amount:</strong> <span id="amount">₦0</span></p>
      <p><strong>Phone:</strong> <span id="phone">-</span></p>
      <p><strong>Address:</strong> <span id="address">-</span></p>
    </div>

    <div class="actions">
      <a class="btn" href="index.html">Back to menu</a>
      <a class="btn secondary" href="https://wa.me/2347077266794?text=Hello%20Obi's%20Snack%20Spot%2C%20I%20want%20to%20confirm%20my%20order." target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>
    </div>
  </div>

  <script>
    const orderData = JSON.parse(sessionStorage.getItem('obiOrderSuccess') || '{}');
    const formatMoney = (value) => `₦${Number(value || 0).toLocaleString('en-NG')}`;

    document.getElementById('customerName').textContent = orderData.customerName || 'Guest';
    document.getElementById('itemSummary').textContent = orderData.itemSummary || 'Your selected items';
    document.getElementById('amount').textContent = formatMoney(orderData.orderTotal || 0);
    document.getElementById('phone').textContent = orderData.phone || 'Not provided';
    document.getElementById('address').textContent = orderData.address || 'Not provided';
  </script>
</body>
</html>
