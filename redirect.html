<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Obi's Snack Spot</title>
  <style>
    :root {
      --brand: #d35400;
      --brand-dark: #a04000;
      --bg: #fff7ef;
      --card: #ffffff;
      --text: #2a1b12;
      --muted: #6f4a38;
      --accent: #ffe0b2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fff8ef 0%, #f7d9a6 100%);
      color: var(--text);
      padding: 24px;
    }

    .redirect-card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid #f0d8b6;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(163, 64, 0, 0.12);
      text-align: center;
      padding: 32px 24px;
    }

    .brand {
      display: inline-block;
      background: var(--accent);
      color: var(--brand-dark);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: var(--brand-dark);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #f7d9a6;
      border-top-color: var(--brand);
      border-radius: 50%;
      margin: 24px auto;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .continue-link {
      display: inline-block;
      margin-top: 12px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
    }

    .continue-link:hover {
      background: var(--brand-dark);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand">Obi's Snack Spot</div>
    <h1>Loading your order page...</h1>
    <p>You will be redirected to the menu shortly so you can place your order.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a class="continue-link" href="index.html">Continue now</a>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2200);
  </script>
</body>
</html>
