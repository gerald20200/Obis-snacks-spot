<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Obi's Snack Spot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fffaf4; color: #2a1b12; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .status { padding: 8px 12px; border-radius: 999px; background: #fff0df; color: #a04000; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #f0d8b6; text-align: left; vertical-align: top; }
    th { background: #fff0df; }
    select { padding: 8px; border: 1px solid #f0d8b6; border-radius: 8px; }
    .hidden { display: none; }
    .error { color: #b42318; font-weight: 700; }
    .btn { background: #d35400; color: white; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Admin Dashboard</h1>
      <button id="logoutBtn" class="btn" type="button">Logout</button>
    </div>

    <p id="statusMessage" class="status">Checking access…</p>
    <div id="accessDenied" class="hidden error">Access denied. Only the authorized admin account may view this page.</div>

    <table id="ordersTable" class="hidden">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Contact</th>
          <th>Address</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./admin-dashboard.js"></script>
</body>
</html>
